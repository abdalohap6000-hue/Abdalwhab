<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1033" />
    <meta name="description" content="قلمي AI — مولّد محتوى عربي احترافي بالذكاء الاصطناعي لمنصات التواصل الاجتماعي" />
    <meta property="og:title" content="قلمي AI — مولد محتوى عربي بالذكاء الاصطناعي" />
    <meta property="og:description" content="أنشئ منشورات احترافية لمنصات التواصل بلمسة واحدة" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <title>قلمي AI — مولد محتوى عربي بالذكاء الاصطناعي</title>
    <style>
      /* خلفية داكنة فورية — تقضي على الوميض الأبيض قبل تشغيل React */
      html, body { background: #020203; margin: 0; padding: 0; }
      /* شاشة انتظار مبدئية ثابتة — يستبدلها React تلقائياً عند الجاهزية */
      #qalami-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      }
      #qalami-boot img {
        width: 88px; height: 88px; border-radius: 26px; object-fit: cover;
        border: 1px solid rgba(124,77,255,0.3);
        box-shadow: 0 0 40px rgba(124,77,255,0.3);
      }
      #qalami-boot h1 { color: #fff; font-size: 34px; font-weight: 900; margin: 0; }
      #qalami-boot p { color: rgba(255,255,255,0.3); font-size: 13px; margin: 0; font-weight: 300; }
      #qalami-boot .bar { width: 160px; height: 3px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; }
      #qalami-boot .bar span { display: block; height: 100%; width: 40%; border-radius: 999px;
        background: linear-gradient(90deg, #7C4DFF, #C084FC); animation: qboot 1.1s ease-in-out infinite; }
      @keyframes qboot { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- شاشة انتظار مبدئية — تستبدل تلقائياً بواجهة التطبيق عند إقلاع React -->
      <div id="qalami-boot">
        <img src="/icon-512.png" alt="" />
        <h1>قلمي</h1>
        <p>مولّد محتوى عربي بالذكاء الاصطناعي</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
