name: Build Android APK
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── إنشاء .env من الأسرار — بدونه يبني التطبيق الوهمي! ──
      - name: Create .env from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}" >> .env
          echo "VITE_REVENUECAT_GOOGLE_KEY=${{ secrets.VITE_REVENUECAT_GOOGLE_KEY }}" >> .env
          echo "VITE_AI_MODEL=${{ vars.VITE_AI_MODEL || 'google/gemini-3-flash-preview' }}" >> .env

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Commit android/ platform folder if newly created
        run: |
          if [ -n "$(git status --porcelain android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android
            git commit -m "chore: sync Capacitor android/ platform"
            git push
          else
            echo "No changes to android/ — nothing to commit."
          fi

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qalami-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
